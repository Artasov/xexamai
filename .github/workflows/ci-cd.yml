name: CI / CD

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub keeps at most one pending run per group even when cancellation is
  # disabled. Scope release groups by tag so a third rapid tag cannot evict the
  # intermediate pending release.
  group: ${{ startsWith(github.ref, 'refs/tags/v') && format('xexamai-release-{0}', github.ref_name) || format('xexamai-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  NODE_VERSION: 24.18.0
  RUST_VERSION: 1.97.0
  AWS_DEFAULT_REGION: ru-1
  S3_BUCKET: 324718a4-2cc5dd7a-917b-4e82-87c5-b9d5f8de16ba
  S3_ENDPOINT: https://s3.twcstorage.ru

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify generated IPC bindings
        run: npm run bindings:check

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build renderer bundle
        run: npm run build:renderer

  package:
    name: Package Tauri (${{ matrix.os }})
    needs: quality
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          - os: macos-15
            platform: darwin
            bundles: app,dmg
          - os: ubuntu-latest
            platform: linux
            bundles: appimage,deb

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-21
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Cleanup stale macOS disk images
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for volume in /Volumes/XEXAMAI /Volumes/XEXAMAI* /Volumes/dmg.*; do
            if [ -d "$volume" ]; then
              hdiutil detach "$volume" || hdiutil detach -force "$volume" || true
            fi
          done
          rm -rf src-tauri/target/release/bundle/dmg

      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # Keep the updater signing key out of checkout, setup and npm lifecycle scripts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: --verbose --bundles ${{ matrix.bundles }}

      - name: Prepare release artifacts
        run: node scripts/prepare-release-artifacts.mjs src-tauri/target/release/bundle release-package "${{ matrix.platform }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ matrix.platform }}
          path: release-package/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.mjs "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" generated-notes.md

      - name: Build signed Tauri update manifest
        shell: bash
        run: |
          release_pub_date="$(git show -s --format=%cI "${{ github.sha }}")"
          node scripts/build-update-manifest.mjs release-artifacts "${{ github.ref_name }}" generated-notes.md release-publication "$release_pub_date"

      - name: Resolve release channel
        id: release-channel
        shell: bash
        run: |
          node -e "const p=require('./release-publication/publication.json'); process.stdout.write('prerelease='+(p.channel==='beta')+'\n')" >> "$GITHUB_OUTPUT"

      - name: Stage immutable release objects in S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-to-s3.mjs release-artifacts release-publication "${{ github.ref_name }}" immutable

      - name: Reconcile and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reconcile-github-release.mjs "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" release-publication/release-body.md release-artifacts "${{ steps.release-channel.outputs.prerelease }}"

      - name: Atomically promote S3 channel manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-to-s3.mjs release-artifacts release-publication "${{ github.ref_name }}" channel
